# Rendered by /app-entrypoint.sh: __RESOLVER__, __PORT__ and __API_UPSTREAM__ are filled in at start.
resolver __RESOLVER__ valid=10s ipv6=on;

server {
    listen __PORT__;
    listen [::]:__PORT__;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A variable makes nginx re-resolve the api on every request instead of once at startup.
    set $api __API_UPSTREAM__;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # REST, GraphQL (including websocket subscriptions), CLI and telemetry all live under /api/.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
