# Rendered by /app-entrypoint.sh: __RESOLVER__, __PORT__ and __API_UPSTREAM__ are filled in at start.
resolver __RESOLVER__ valid=10s ipv6=on;

# Send "Connection: upgrade" only for websocket requests.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Railway's edge proxy puts the client address in X-Forwarded-For. Pass that header through untouched
# (the API trusts this service as a proxy and resolves the real client from it) instead of appending
# the edge proxy's own address; fall back to the peer address when the header is absent.
map $http_x_forwarded_for $client_xff { '' $remote_addr; default $http_x_forwarded_for; }

server {
    listen __PORT__;
    listen [::]:__PORT__;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A variable makes nginx re-resolve the api on every request instead of once at startup.
    set $api __API_UPSTREAM__;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # REST, GraphQL (including websocket subscriptions), CLI and telemetry all live under /api/.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
