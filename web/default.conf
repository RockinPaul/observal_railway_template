# Rendered by /app-entrypoint.sh: __RESOLVER__, __PORT__ and __API_UPSTREAM__ are filled in at start.
resolver __RESOLVER__ valid=10s ipv6=on;

# Send "Connection: upgrade" only for websocket requests.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Railway's edge proxy appends its own public address to X-Forwarded-For ("client, edge"). Strip that
# last hop and pass the rest through, so the API (which trusts this service as a proxy and walks the
# header right to left) sees the real client. An extra proxy in front of Railway, such as Cloudflare,
# stays in the chain and is handled by Observal's own Trusted Proxies setting.
# Only pass a sane scheme on; Railway terminates TLS and sends X-Forwarded-Proto itself.
map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; http http; }
map $http_x_forwarded_for $client_xff {
    default                                  $remote_addr;
    "~^(?<chain>.+?)\s*,\s*[^,\s]+\s*$"   $chain;
    "~^\s*(?<single>[^,\s]+)\s*$"          $single;
}

server {
    listen __PORT__;
    listen [::]:__PORT__;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;   # matches the API's MAX_REQUEST_SIZE_MB default

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A variable makes nginx re-resolve the api on every request instead of once at startup.
    set $api __API_UPSTREAM__;

    location /assets/ {
        expires 1y;
        # add_header in a location replaces the server-level set, so repeat the security headers.
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # REST, GraphQL (including websocket subscriptions), CLI and telemetry all live under /api/.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
